<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neha Bhatt Artistry</title>
    <style>
        body { background-color: #0f0f0f; color: #333; font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; }
        .logo { color: #c5a059; text-align: center; margin: 40px 0; letter-spacing: 3px; font-size: 24px; font-weight: bold; }
        .card { background: white; border-radius: 15px; padding: 25px; margin-bottom: 25px; text-align: center; border-left: 5px solid red; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        h2 { margin-bottom: 15px; color: #000; font-size: 18px; text-transform: uppercase; }
        
        /* THE FIXED TAP SLIDER */
        .slider-container {
            width: 100%;
            max-width: 320px; 
            height: 250px;
            margin: 0 auto;
            overflow: hidden;
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            border: 1px solid #ddd;
        }

        .slider-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
            transition: transform 0.5s ease-in-out; 
        }

        .slider-wrapper img {
            min-width: 100%; 
            height: 100%;
            object-fit: cover;
        }

        .btn { display: inline-block; background: #25D366; color: white; padding: 12px 25px; text-decoration: none; border-radius: 5px; margin-top: 10px; font-weight: bold; }
        p.tip { font-size: 11px; color: #888; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="logo">NEHA BHATT</h1>

        <div class="card">
            <h2>About Me</h2>
            <p>Certified Professional Makeup Artist based in Dehradun. Specialized in Bridal and Party makeup.</p>
        </div>

        <!-- UPDATED HEADING: MY EYE WORK -->
        <div class="card">
            <h2>My Eye Work</h2>
            <div class="slider-container" id="slider" onclick="nextSlide()">
                <div class="slider-wrapper" id="wrapper">
                    <img src="eyework1.jpeg">
                    <img src="eyework2.jpeg">
                    <img src="eyework3.jpeg">
                    <img src="eyework4.jpeg">
                    <img src="eyework5.jpeg">
                    <img src="eyework6.jpeg">
                    <img src="eyework7.jpeg">
                </div>
            </div>
            <p class="tip">Slides automatically • Tap photo to see next</p>
        </div>

        <div class="card">
            <h2>Contact</h2>
            <p>Dehradun, Uttarakhand</p>
            <p>Phone: +91 91934 96953</p>
            <a href="https://wa.me" class="btn">WhatsApp Me</a>
        </div>
    </div>

    <script>
        let index = 0;
        const wrapper = document.getElementById('wrapper');
        const totalImages = 7;

        function showSlide() {
            wrapper.style.transform = `translateX(-${index * 100}%)`;
        }

        function nextSlide() {
            index = (index + 1) % totalImages;
            showSlide();
        }

        setInterval(nextSlide, 4000);
    </script>
</body>
</html>
