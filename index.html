<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neha Bhatt Artistry | Dehradun</title>
    <!-- FIXED: Added actual font and slider links -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://jsdelivr.net" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav>
        <div class="logo">NEHA BHATT</div>
        <div class="nav-links">
            <a href="#about">About</a>
            <a href="#work">Portfolio</a>
            <a href="https://wa.me" class="cta">Book Now</a>
        </div>
    </nav>

    <header id="about" class="hero">
        <div class="hero-content">
            <span class="gold-text">Certified Artist • Orane International</span>
            <h1>The Art of Transformation</h1>
            <p>Dehradun based makeup artist specializing in high-end Bridal and Glamour transformations.</p>
        </div>
    </header>

    <main id="work">
        <section class="section">
            <h2 class="section-title">Eye Artistry</h2>
            <div class="swiper eyeSwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide"><img src="eyework1.jpeg"></div>
                    <div class="swiper-slide"><img src="eyework2.jpeg"></div>
                    <div class="swiper-slide"><img src="eyework3.jpeg"></div>
                    <div class="swiper-slide"><img src="eyework4.jpeg"></div>
                </div>
                <div class="swiper-pagination"></div>
            </div>
        </section>

        <section class="section">
            <h2 class="section-title">Bridal & Glamour</h2>
            <div class="swiper faceSwiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide"><img src="facework12traditional.jpeg"></div>
                    <div class="swiper-slide"><img src="facework13traditional.jpeg"></div>
                    <div class="swiper-slide"><img src="facework4mirrorphoto.jpeg"></div>
                    <div class="swiper-slide"><img src="facework7.jpeg"></div>
                </div>
                <div class="swiper-pagination"></div>
            </div>
        </section>

        <section class="cert-section">
            <h2 class="section-title">Certification</h2>
            <div class="cert-card">
                <img src="certificate.jpeg" alt="Certification">
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Neha Bhatt Artistry</p>
        <a href="https://wa.me" class="wa-btn">WhatsApp Booking</a>
    </footer>

    <!-- FIXED: Added actual Swiper script link -->
    <script src="https://jsdelivr.net"></script>
    <script>
        const config = {
            loop: true,
            autoplay: { delay: 3000 },
            pagination: { el: ".swiper-pagination", clickable: true },
            breakpoints: {
                320: { slidesPerView: 1.2, spaceBetween: 15 },
                1024: { slidesPerView: 3.5, spaceBetween: 30 }
            }
        };
        new Swiper(".eyeSwiper", config);
        new Swiper(".faceSwiper", config);
    </script>
</body>
</html>
