<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neha Bhatt Artistry</title>
    <style>
        /* Design is included here so you don't need a separate CSS file */
        body { 
            background-color: #0f0f0f; 
            color: #333; 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            padding: 20px; 
        }
        .container { width: 100%; max-width: 500px; }
        .logo { color: #c5a059; text-align: center; margin: 40px 0; letter-spacing: 3px; }
        .card { 
            background: white; 
            border-radius: 10px; 
            padding: 25px; 
            margin-bottom: 20px; 
            text-align: center; 
            border-left: 5px solid red; 
        }
        h2 { margin-bottom: 10px; color: #000; }
        .btn { 
            display: inline-block; 
            background: #25D366; 
            color: white; 
            padding: 10px 20px; 
            text-decoration: none; 
            border-radius: 5px; 
            margin-top: 10px; 
        }
        .placeholder { 
            height: 150px; 
            background: #f0f0f0; 
            border: 2px dashed #ccc; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            color: #888; 
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="logo">NEHA BHATT</h1>

        <div class="card">
            <h2>About Me</h2>
            <p>Certified Professional Makeup Artist based in Dehradun. Specialized in Bridal and Party makeup.</p>
        </div>

        <div class="card">
            <h2>My Work</h2>
            <div class="placeholder">Photos Coming Soon</div>
        </div>

        <div class="card">
            <h2>Contact</h2>
            <p>Dehradun, Uttarakhand</p>
            <p>Phone: +91 91934 96953</p>
            <a href="https://wa.me" class="btn">WhatsApp Me</a>
        </div>
    </div>

</body>
</html>
