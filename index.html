<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neha Bhatt Artistry</title>
    <style>
        body { background-color: #0f0f0f; color: #333; font-family: Arial, sans-serif; display: flex; justify-content: center; padding: 20px; }
        .container { width: 100%; max-width: 500px; }
        .logo { color: #c5a059; text-align: center; margin: 40px 0; letter-spacing: 3px; font-size: 24px; }
        .card { background: white; border-radius: 10px; padding: 25px; margin-bottom: 20px; text-align: center; border-left: 5px solid red; }
        h2 { margin-bottom: 15px; color: #000; font-size: 18px; text-transform: uppercase; }
        
        /* THE FIXED SLIDESHOW */
        .slideshow-container {
            width: 100%;
            max-width: 300px; /* Makes the photo container smaller */
            height: 250px;    /* Smaller height for professional look */
            overflow: hidden; 
            border-radius: 8px;
            position: relative;
            margin: 0 auto;   /* Centers the photo box */
            border: 1px solid #ddd;
        }

        .slider-wrapper {
            display: flex;
            width: 700%; /* Total images (7) */
            animation: slide-fixed 20s infinite ease-in-out;
        }

        .slider-wrapper img {
            width: 14.285%; /* 100 divided by 7 images = 14.285% each */
            height: 250px;
            object-fit: cover; /* Centers the focus of the photo */
        }

        /* Fixed Math: Each step is exactly -14.28% */
        @keyframes slide-fixed {
            0%   { transform: translateX(0); }
            12%  { transform: translateX(0); }
            14%  { transform: translateX(-14.28%); }
            26%  { transform: translateX(-14.28%); }
            28%  { transform: translateX(-28.57%); }
            40%  { transform: translateX(-28.57%); }
            42%  { transform: translateX(-42.85%); }
            54%  { transform: translateX(-42.85%); }
            56%  { transform: translateX(-57.14%); }
            68%  { transform: translateX(-57.14%); }
            70%  { transform: translateX(-71.42%); }
            82%  { transform: translateX(-71.42%); }
            84%  { transform: translateX(-85.71%); }
            98%  { transform: translateX(-85.71%); }
            100% { transform: translateX(0); }
        }

        .btn { display: inline-block; background: #25D366; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="logo">NEHA BHATT</h1>

        <div class="card">
            <h2>About Me</h2>
            <p>Certified Professional Makeup Artist based in Dehradun. Trained at Orane International.</p>
        </div>

        <div class="card">
            <h2>My Work</h2>
            <div class="slideshow-container">
                <div class="slider-wrapper">
                    <!-- Images listed here -->
                    <img src="eyework1.jpeg">
                    <img src="eyework2.jpeg">
                    <img src="eyework3.jpeg">
                    <img src="eyework4.jpeg">
                    <img src="eyework5.jpeg">
                    <img src="eyework6.jpeg">
                    <img src="eyework7.jpeg">
                </div>
            </div>
            <p style="margin-top: 10px; font-size: 11px; color: #888;">Slide automatic • Tap to pause</p>
        </div>

        <div class="card">
            <h2>Contact</h2>
            <p>Dehradun, Uttarakhand</p>
            <p>Phone: +91 91934 96953</p>
            <a href="https://wa.me" class="btn">WhatsApp Me</a>
        </div>
    </div>

</body>
</html>
