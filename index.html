<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neha Bhatt | Professional Makeup Artist</title>
    <!-- Google Fonts for a Premium Look -->
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">NEHA BHATT</div>
        <ul class="nav-links">
            <li><a href="#home">Home</a></li>
            <li><a href="#portfolio">Portfolio</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <header id="home" class="hero">
        <div class="hero-content">
            <h1>Artistry in Every Brushstroke</h1>
            <p>Bridal • Editorial • Party Glow</p>
            <a href="#contact" class="btn">Book an Appointment</a>
        </div>
    </header>

    <!-- Portfolio Gallery -->
    <section id="portfolio" class="gallery-section">
        <h2 class="section-title">The Portfolio</h2>
        <div class="gallery-grid">
            <!-- Replace these with your actual image paths later -->
            <div class="gallery-item"><img src="images/photo1.jpg" alt="Bridal Look 1"></div>
            <div class="gallery-item"><img src="images/photo2.jpg" alt="Party Look 1"></div>
            <div class="gallery-item"><img src="images/photo3.jpg" alt="Editorial Look"></div>
            <div class="gallery-item"><img src="images/photo4.jpg" alt="Bridal Look 2"></div>
            <div class="gallery-item"><img src="images/photo5.jpg" alt="Glamour Look"></div>
            <div class="gallery-item"><img src="images/photo6.jpg" alt="Reception Look"></div>
        </div>
    </section>

    <!-- Footer / Contact -->
    <footer id="contact">
        <h2>Get in Touch</h2>
        <p>Available for bookings worldwide</p>
        <div class="social-links">
            <a href="#">Instagram</a> | <a href="#">WhatsApp</a> | <a href="#">Email</a>
        </div>
        <p class="copyright">&copy; 2024 Neha Bhatt Artistry</p>
    </footer>

</body>
</html>
